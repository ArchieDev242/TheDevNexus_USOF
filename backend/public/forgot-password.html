<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Забыли пароль</title>
    <link rel="stylesheet" href="./styles/styles.css" />
    </head>
    <body>
    <div class="box">
        <h1 class="title">Забыли пароль?</h1>
        <p class="muted">Укажите email. Мы отправим ссылку для сброса пароля.</p>
        <div id="status" class="status info" style="display:none"></div>
        <form id="form" novalidate>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="Введите email" />
        </div>
        <button type="submit" id="submit">Отправить ссылку</button>
        </form>
        <p class="muted" style="margin-top:12px">
        Вспомнили пароль? <a href="/login">Войти</a>
        </p>
    </div>
    <script src="/js/forgot.js"></script>
</body>
</html>
