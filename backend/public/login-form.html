<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход</title>
    <link rel="stylesheet" href="./styles/styles.css" />
    </head>
    <body>
    <div class="box">
        <h1 class="title">Вход</h1>

        <div id="status" class="status info" style="display:none"></div>
        <form id="form" novalidate>
        <div class="field">
            <label for="loginOrEmail">Email или логин</label>
            <input id="loginOrEmail" name="loginOrEmail" type="text" required placeholder="Введите email или логин" />
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" minlength="8" required placeholder="Введите пароль" />
        </div>
        <button type="submit" id="submit">Войти</button>
        </form>
        <p class="muted" style="margin-top:12px">
        Нет аккаунта? <a href="/register">Регистрация</a> · <a href="/forgot-password">Забыли пароль?</a>
        </p>
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
