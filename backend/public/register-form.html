<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="./styles/styles.css" />
    </head>
    <body>
    <div class="box">
        <h1 class="title">Регистрация</h1>
        <div id="status" class="status info" style="display:none"></div>
        <form id="form" novalidate>
        <div class="field">
            <label for="login">Логин</label>
            <input id="login" name="login" type="text" required placeholder="Логин" />
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" minlength="8" required placeholder="Не менее 8 символов" />
        </div>
        <div class="field">
            <label for="fullName">Полное имя</label>
            <input id="fullName" name="full_name" type="text" required placeholder="Введите полное имя" />
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="Введите email" />
        </div>
        <button type="submit" id="submit">Зарегистрироваться</button>
        </form>
        <p class="muted" style="margin-top:12px">
        Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
    </div>
    <script src="/js/register.js"></script>
</body>
</html>
